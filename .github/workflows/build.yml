name: Build

# Types, native modules, the whole test suite (Kotlin tests ported from Komga plus the
# comparisons against values recorded from the real Komga/JVM libraries).
#
# Nothing here needs Java or a running Komga: every reference value used by the tests is
# committed as a fixture. The oracle scripts that produced them (tools/jshell-komga.sh,
# tools/run-kotlin-oracles.sh) are only run by hand, when a fixture has to be regenerated.

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [main]
  workflow_dispatch:

# One group per reference: a tagged build must never be cancelled by a later push.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Kotlin oracle unit tests (test/unit/, see PORTING.md): the fixtures are committed, produced by the oracle tests
  # of the Komga fork (branch unit-oracles), whose own workflow checks they are still identical. Fast: native modules only.
  unit:
    name: Unit tests (Kotlin oracles)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: npm

      # ICU for the SQLite collation extension (in-memory Komga databases of the DAO oracles, test/unit/db.ts)
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libicu-dev

      - run: npm ci

      # SQLite extension (test/unit/db.ts) and JDK-identical JPEG codec (image oracles)
      - run: npm run build:native

      - run: npm run test:unit

      - name: Kotlin functions covered by an oracle
        run: |
          npm run --silent test:unit:coverage | tee coverage.txt
          { echo '```'; cat coverage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # The linux/arm/v7 image runs on Node 22 (no Node 24 build exists for armv7, see the Dockerfile): same suite on
  # Node 22, so that runtime is tested too.
  node22:
    name: Tests on Node 22 (armv7 image runtime)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: System libraries and locale
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libicu-dev zip locales
          sudo locale-gen fr_FR.UTF-8

      - run: npm ci

      - run: npm run build:native

      - run: npm run test:unit

      - name: Tests
        run: npx vitest run
        env:
          TZ: Europe/Paris
          LANG: fr_FR.UTF-8

      # The compiled output under Node's own ESM loader (Vitest resolves modules differently: Node 22 does not see
      # some named exports of CommonJS modules that Node 24 sees), then the server answers and checks a password.
      - run: npm run build

      - name: Server starts on Node 22
        run: |
          mkdir -p "$RUNNER_TEMP/config"
          node --expose-gc dist/src/main.js --komga.config-dir="$RUNNER_TEMP/config" > server.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://localhost:25600/api/v1/claim > /dev/null 2>&1 && break; sleep 2; done
          curl -fsS -X POST -H 'X-Komga-Email: admin@example.org' -H 'X-Komga-Password: secret' http://localhost:25600/api/v1/claim > /dev/null \
            && curl -fsS -u admin@example.org:secret http://localhost:25600/api/v2/users/me > /dev/null \
            && test "$(curl -s -o /dev/null -w '%{http_code}' -u admin@example.org:wrong http://localhost:25600/api/v2/users/me)" = 401 \
            || { cat server.log; exit 1; }

  # The linux/amd64 and linux/arm64 images run on Alpine (musl) with a Node.js built with V8 pointer compression
  # (see the Dockerfile): same suite inside that image, so that runtime is tested too.
  alpine:
    name: Tests on Alpine (amd64 and arm64 image runtime)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Oracle and integration tests in the Alpine image
        run: docker run --rm -v "$PWD:/src:ro" smeagolworms4/node-pointer-compression:24-alpine sh /src/tools/alpine-tests.sh

  verify:
    name: Types, native modules and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # A pinned version, never the major alone: moving up should be a decision.
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: npm

      # ICU for the SQLite collation extension (native/komga_sqlite.c), zip for the test fixtures.
      # The reference values were recorded on a French machine (Europe/Paris, fr_FR): number formats,
      # default collation locale and time zone conversions follow the JVM defaults of that machine.
      - name: System libraries and locale
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libicu-dev zip locales
          sudo locale-gen fr_FR.UTF-8

      - run: npm ci

      # Known vulnerabilities in the production dependencies (the ones shipped in the image): high or critical fail.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # SQLite extension (ICU collations, DQS), the JDK-identical JPEG codec (IJG libjpeg 6b + LittleCMS) and bcrypt.
      - name: Native modules
        run: npm run build:native

      - run: npm run typecheck

      - name: Port status (every Kotlin file and test has its TypeScript twin)
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/gotson/komga.git ../komga-src
          git -C ../komga-src checkout "$(cat UPSTREAM_REF)"
          ln -sfn ../komga-src upstream
          node tools/port-status.mjs

      - name: Tests
        run: npx vitest run
        env:
          TZ: Europe/Paris
          LANG: fr_FR.UTF-8

      - name: Build
        run: npm run build

  image:
    name: Docker image
    needs: [verify, unit, node22, alpine]
    # Published only from main and version tags; pull requests only build it.
    # A manual run on another branch (workflow_dispatch) only runs the tests.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    env:
      DOCKERHUB_USER: ${{ secrets.DOCKER_USERNAME }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Komga commit ported by this revision
        id: upstream
        run: echo "ref=$(cat UPSTREAM_REF)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub (smeagolworms4/komga-js) : publié en plus de ghcr.io quand les secrets DOCKER_USERNAME et
      # DOCKER_PASSWORD (jeton d'accès Docker Hub) sont définis dans le dépôt.
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request' && env.DOCKERHUB_USER != ''
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # `:main` is a moving tag, republished on every push to main; versions (v1.2.3) are stable tags.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/komga-js
            name=docker.io/smeagolworms4/komga-js,enable=${{ env.DOCKERHUB_USER != '' }}
          tags: |
            type=ref,event=branch
            # Tags vX.Y.Z.N : X.Y.Z = version de Komga portée, N = révision du portage
            # -> images X.Y.Z.N (figée), X.Y.Z (dernière révision de cette version de Komga) et latest
            type=match,pattern=^v(\d+\.\d+\.\d+\.\d+)$,group=1
            type=match,pattern=^v(\d+\.\d+\.\d+)\.\d+$,group=1
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,format=short

      - uses: docker/build-push-action@v7
        with:
          context: .
          # linux/amd64 and linux/arm64: Alpine, Node.js with pointer compression; linux/arm/v7: Debian, Node 22,
          # better-sqlite3 compiled from source under QEMU (~10 min without cache)
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          build-args: |
            KOMGA_REF=${{ steps.upstream.outputs.ref }}
            GIT_BRANCH=${{ github.ref_name }}
            GIT_COMMIT=${{ github.sha }}
            GIT_COMMIT_TIME=${{ github.event.head_commit.timestamp }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
