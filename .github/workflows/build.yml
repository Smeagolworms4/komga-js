name: Build

# Types, native modules, the whole test suite (Kotlin tests ported from Komga plus the
# comparisons against values recorded from the real Komga/JVM libraries).
#
# Nothing here needs Java or a running Komga: every reference value used by the tests is
# committed as a fixture. The oracle scripts that produced them (tools/jshell-komga.sh,
# tools/run-kotlin-oracles.sh) are only run by hand, when a fixture has to be regenerated.

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [main]
  workflow_dispatch:

# One group per reference: a tagged build must never be cancelled by a later push.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Kotlin oracle unit tests (test/unit/, see PORTING.md): the fixtures are committed, produced by the oracle tests
  # of the Komga fork (branch unit-oracles), whose own workflow checks they are still identical. Fast: native modules only.
  unit:
    name: Unit tests (Kotlin oracles)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: npm

      # ICU for the SQLite collation extension (in-memory Komga databases of the DAO oracles, test/unit/db.ts)
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libicu-dev

      - run: npm ci

      # SQLite extension (test/unit/db.ts) and JDK-identical JPEG codec (image oracles)
      - run: npm run build:native

      - run: npm run test:unit

      - name: Kotlin functions covered by an oracle
        run: |
          npm run --silent test:unit:coverage | tee coverage.txt
          { echo '```'; cat coverage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  verify:
    name: Types, native modules and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # A pinned version, never the major alone: moving up should be a decision.
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: npm

      # ICU for the SQLite collation extension (native/komga_sqlite.c), zip for the test fixtures.
      # The reference values were recorded on a French machine (Europe/Paris, fr_FR): number formats,
      # default collation locale and time zone conversions follow the JVM defaults of that machine.
      - name: System libraries and locale
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libicu-dev zip locales
          sudo locale-gen fr_FR.UTF-8

      - run: npm ci

      # Known vulnerabilities in the production dependencies (the ones shipped in the image): high or critical fail.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # SQLite extension (ICU collations, DQS), the JDK-identical JPEG codec (IJG libjpeg 6b + LittleCMS) and bcrypt.
      - name: Native modules
        run: npm run build:native

      - run: npm run typecheck

      - name: Port status (every Kotlin file and test has its TypeScript twin)
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/gotson/komga.git ../komga-src
          git -C ../komga-src checkout "$(cat UPSTREAM_REF)"
          ln -sfn ../komga-src upstream
          node tools/port-status.mjs

      - name: Tests
        run: npx vitest run
        env:
          TZ: Europe/Paris
          LANG: fr_FR.UTF-8

      - name: Build
        run: npm run build

  image:
    name: Docker image
    needs: [verify, unit]
    # Published only from main and version tags; pull requests only build it.
    # A manual run on another branch (workflow_dispatch) only runs the tests.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Komga commit ported by this revision
        id: upstream
        run: echo "ref=$(cat UPSTREAM_REF)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `:main` is a moving tag, republished on every push to main; versions (v1.2.3) are stable tags.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/komga-js
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: |
            KOMGA_REF=${{ steps.upstream.outputs.ref }}
            GIT_BRANCH=${{ github.ref_name }}
            GIT_COMMIT=${{ github.sha }}
            GIT_COMMIT_TIME=${{ github.event.head_commit.timestamp }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
