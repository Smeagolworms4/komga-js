name: Alpine image (test)

# Essai : KomgaJS sur Alpine avec un Node.js à compression de pointeurs (Dockerfile.alpine), construit sur un runner
# arm64 natif et publié sous un tag de test, ghcr.io/<dépôt>:alpine-arm64-test. Ne touche à aucun tag publié.

on:
  push:
    branches: [alpine-pointer-compression]
  workflow_dispatch:

concurrency:
  group: alpine-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  arm64:
    name: linux/arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      # Tags par architecture de node-pointer-compression : les tags multi-architecture n'existent qu'une fois les
      # deux architectures publiées.
      NODE_BUILD_IMAGE: smeagolworms4/node-pointer-compression:24.21.0-alpine-arm64
      NODE_RUN_IMAGE: smeagolworms4/node-pointer-compression:24.21.0-alpine-slim-arm64
    steps:
      - uses: actions/checkout@v7

      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}:alpine-arm64-test" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          docker build -f Dockerfile.alpine \
            --build-arg "KOMGA_REF=$(cat UPSTREAM_REF)" \
            --build-arg "NODE_BUILD_IMAGE=$NODE_BUILD_IMAGE" --build-arg "NODE_RUN_IMAGE=$NODE_RUN_IMAGE" \
            --build-arg "GIT_BRANCH=$GITHUB_REF_NAME" --build-arg "GIT_COMMIT=$GITHUB_SHA" \
            -t "${{ steps.image.outputs.name }}" .
          docker images "${{ steps.image.outputs.name }}" --format '{{.Repository}}:{{.Tag}}  {{.Size}}' | tee -a "$GITHUB_STEP_SUMMARY"

      # Même vérification que l'image principale (build.yml) : le serveur démarre, se laisse réclamer, authentifie.
      - name: Smoke test
        run: |
          docker run -d --name komgajs -p 25600:25600 "${{ steps.image.outputs.name }}"
          for i in $(seq 1 60); do curl -fsS http://localhost:25600/api/v1/claim > /dev/null 2>&1 && break; sleep 2; done
          curl -fsS -X POST -H 'X-Komga-Email: admin@example.org' -H 'X-Komga-Password: secret' http://localhost:25600/api/v1/claim > /dev/null \
            && curl -fsS -u admin@example.org:secret http://localhost:25600/api/v2/users/me > /dev/null \
            && test "$(curl -s -o /dev/null -w '%{http_code}' -u admin@example.org:wrong http://localhost:25600/api/v2/users/me)" = 401 \
            && test "$(docker exec komgajs node -p process.config.variables.v8_enable_pointer_compression)" = 1 \
            || { docker logs komgajs; exit 1; }

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - run: docker push "${{ steps.image.outputs.name }}"
